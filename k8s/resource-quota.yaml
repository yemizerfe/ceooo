# =============================================================================
# CEOOO — namespace guard rails
#
# A quota keeps a runaway rollout (or a bad HPA config) from consuming the
# whole cluster; the LimitRange guarantees every pod gets sane defaults.
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ceooo-quota
  namespace: ceooo
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    persistentvolumeclaims: "6"
    requests.storage: 60Gi
    count/deployments.apps: "8"
    count/statefulsets.apps: "4"
    count/jobs.batch: "10"
    count/services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ceooo-defaults
  namespace: ceooo
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
