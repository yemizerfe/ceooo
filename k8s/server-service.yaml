apiVersion: v1
kind: Service
metadata:
  name: ceooo-server
  namespace: ceooo
  labels:
    app: ceooo
    component: server
  annotations:
    # If you use a cloud load balancer, add service.beta.kubernetes.io/ annotations
    # here (e.g. AWS load balancer type, GCP backend config, Azure load balancer SKU).
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5010
      targetPort: 5010
      protocol: TCP
  selector:
    app: ceooo
    component: server
