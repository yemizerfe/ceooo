# =============================================================================
# CEOOO — Ingress
#
#   /api/*      -> ceooo-server:5010   (REST API)
#   /health*    -> ceooo-server:5010   (probes / uptime checks)
#   /metrics    -> ceooo-server:5010   (Prometheus scrape, not public — see note)
#   /uploads/*  -> ceooo-server:5010   (uploaded files)
#   /*          -> ceooo-client:3000   (Next.js app)
#
# TLS: install cert-manager and uncomment the cluster-issuer annotation, or
# create the secret manually:
#   kubectl create secret tls ceooo-tls --cert=fullchain.pem --key=privkey.pem -n ceooo
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceooo-ingress
  namespace: ceooo
  labels:
    app: ceooo
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Server: ceooo";
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ceooo.example.com
      secretName: ceooo-tls
  rules:
    - host: ceooo.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ceooo-server
                port:
                  number: 5010
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ceooo-server
                port:
                  number: 5010
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: ceooo-server
                port:
                  number: 5010
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ceooo-client
                port:
                  number: 3000
---
# Internal-only Service for /metrics so Prometheus can scrape without exposing
# metrics through the public Ingress.
apiVersion: v1
kind: Service
metadata:
  name: ceooo-server-metrics
  namespace: ceooo
  labels:
    app: ceooo
    component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 5010
      targetPort: 5010
  selector:
    app: ceooo
    component: server
