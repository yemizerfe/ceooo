# =============================================================================
# CEOOO — Kubernetes Secret (template)
#
# Generate a real secret manifest from this template before applying:
#
#   kubectl create secret generic ceooo-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=GOOGLE_API_KEY="your-key" \
#     --from-literal=GOOGLE_CLIENT_ID="your-id" \
#     --from-literal=GOOGLE_CLIENT_SECRET="your-secret" \
#     --from-literal=SMTP_PASS="your-smtp-pass" \
#     --namespace=ceooo \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This empty template is documentation only. Never apply it to a cluster.
# Real secrets belong in a secret manager or sealed-secrets / external-secrets,
# not in Git.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ceooo-secrets
  namespace: ceooo
type: Opaque
stringData:
  # ---- Auth ----
  JWT_SECRET: ""
  SESSION_SECRET: ""

  # ---- Google OAuth ----
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # ---- Gemini AI ----
  GOOGLE_API_KEY: ""

  # ---- GitHub OAuth ----
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""

  # ---- SMTP (transaction email; leave blank to disable) ----
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASS: ""

  # ---- Admin CLI / first-user flows ----
  ADMIN_PASSWORD_RESET: ""

  # ---- Platform administrator (created/promoted on boot) ----
  # Set these to provision the admin account; leave empty to skip.
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
  ADMIN_NAME: "Platform Administrator"
  ADMIN_RESET_PASSWORD: "false"

  # ---- Database credential used by both the app and migration job ----
  DB_PASSWORD: ""
