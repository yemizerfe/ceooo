# =============================================================================
# CEOOO — HorizontalPodAutoscaler
#
# Scale the server deployment between 2 and 10 replicas based on:
#   1. CPU utilisation (target 70% of request)
#   2. Custom Prometheus metric: HTTP request latency (p95) — optional,
#      requires a metrics-server + prometheus adapter or KEDA.
#
# Prerequisites:
#   - metrics-server running in the cluster (for cpu/memory metrics)
#   - (optional) prometheus-adapter or KEDA for custom metrics
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ceooo-server-hpa
  namespace: ceooo
  labels:
    app: ceooo
    component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ceooo-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # ---- CPU-based scaling ----
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # ---- Memory-based scaling (guard rail; raise if the process is memory-bound) ----
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # ---- Custom: HTTP request rate / queue depth (optional) ----
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "100"
    #
    # ---- Custom: queue depth (useful if you add a BullMQ/Redis job queue) ----
    # - type: External
    #   external:
    #     metric:
    #       name: redis_queue_depth
    #     target:
    #       type: AverageValue
    #       averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
