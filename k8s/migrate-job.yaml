apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: ceooo
  labels:
    app: prisma-migrate
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: prisma-migrate
        component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for postgres-service.ceooo.svc.cluster.local:5432..."
              for i in $(seq 1 30); do
                if nc -z postgres-service.ceooo.svc.cluster.local 5432; then
                  echo "Postgres is ready."
                  exit 0
                fi
                echo "Attempt $i/30 — sleeping 2s..."
                sleep 2
              done
              echo "Postgres did not become ready in time."
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: migrate
          image: ceooo-server:latest
          imagePullPolicy: Always
          args: ["migrate"]
          env:
            - name: HOME
              value: /tmp
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: DB_NAME
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-service.ceooo.svc.cluster.local:5432/$(DB_NAME)?schema=public"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
