apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceooo-server
  namespace: ceooo
  labels:
    app: ceooo
    component: server
    tier: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ceooo
      component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ceooo
        component: server
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5010"
        prometheus.io/path: "/metrics"
    spec:
      # Must exceed the app's drain window (10s) plus pool teardown.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              until nc -z postgres-service.ceooo.svc.cluster.local 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
              echo "postgres ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Redis is optional: warn and continue if it is not there.
              for i in $(seq 1 15); do
                if nc -z redis-service.ceooo.svc.cluster.local 6379; then
                  echo "redis ready"; exit 0
                fi
                sleep 2
              done
              echo "redis unavailable — continuing without it (cache disabled)"
              exit 0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: server
          image: ceooo-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5010
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: LOG_LEVEL
            - name: TRUST_PROXY_HOPS
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: TRUST_PROXY_HOPS
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: BACKEND_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: DB_NAME
            - name: UPLOADS_DIR
              value: /app/uploads
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-service.ceooo.svc.cluster.local:5432/$(DB_NAME)?schema=public&connection_limit=10&pool_timeout=20"
            - name: REDIS_URL
              value: "redis://redis-service.ceooo.svc.cluster.local:6379"
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: FRONTEND_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: JWT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: SESSION_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: GOOGLE_CALLBACK_URL
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: GOOGLE_API_KEY
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: GITHUB_CLIENT_SECRET
                  optional: true
            - name: GITHUB_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: GITHUB_CALLBACK_URL
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: GEMINI_MODEL
            - name: AI_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: AI_TIMEOUT
            - name: AI_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: AI_MAX_RETRIES
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: SMTP_PASS
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: ceooo-config
                  key: SMTP_FROM
            - name: ADMIN_PASSWORD_RESET
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: ADMIN_PASSWORD_RESET
                  optional: true
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: ADMIN_PASSWORD
                  optional: true
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: ADMIN_NAME
                  optional: true
            - name: ADMIN_RESET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceooo-secrets
                  key: ADMIN_RESET_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 320Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 5010
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 5010
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5010
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give the ingress a moment to remove this pod from endpoints
                # before the process starts draining connections.
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: ceooo
  labels:
    app: ceooo
    component: uploads
spec:
  # ReadWriteOnce keeps this portable. With more than one replica on different
  # nodes use a ReadWriteMany class, or move uploads to object storage (S3/R2).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
