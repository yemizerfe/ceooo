# =============================================================================
# CEOOO — metrics ServiceAccount (optional)
#
# If you plan to run a Prometheus scraper with a dedicated service account
# instead of the default cluster role, bind a minimal Role here.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ceooo-metrics
  namespace: ceooo
  labels:
    app: ceooo
    component: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ceooo-metrics-role
  namespace: ceooo
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ceooo-metrics-binding
  namespace: ceooo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ceooo-metrics-role
subjects:
  - kind: ServiceAccount
    name: ceooo-metrics
    namespace: ceooo
